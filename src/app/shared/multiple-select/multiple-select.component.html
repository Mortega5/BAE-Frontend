<div class="relative w-full" [attr.id]="id" [attr.data-cy]="dataCy">
  <div
    class="bg-gray-50 dark:bg-secondary-300 border border-gray-300 dark:border-secondary-200 rounded-lg p-2 flex flex-wrap gap-1 cursor-pointer"
    [class.pointer-events-none]="isReadonly" [class.opacity-60]="isReadonly" (click)="toggleDropdown()">
    @for (item of selectedLabels; track item.value) {
    <span class="bg-primary-100 text-white text-sm font-medium leading-none pl-3 pr-1.5 py-1.5 rounded-full shadow-sm inline-flex items-center gap-1">
      <span>{{ item.label | translate }}</span>
      <button type="button"
        class="inline-flex items-center justify-center w-4 h-4 p-0 border-0 leading-none rounded-full text-red-400 hover:text-red-600 hover:bg-white/80"
        (click)="removeItem(item, $event)">
        <svg class="w-3 h-3 block" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
          stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </span>
    }
    @if (selectedLabels.length === 0) {
    <span class="text-gray-500 dark:text-gray-400">Select items...</span>
    }
  </div>

  @if (isOpen) {
  <div
    class="absolute mt-1 w-full bg-white dark:bg-secondary-300 dark:text-white border border-gray-300 dark:border-secondary-200 rounded-lg shadow-lg z-10">
    <ul class="max-h-48 overflow-y-auto">
      @for (option of normalizedOptions; track option.value) {
      <li (click)="toggleSelection(option)"
        class="cursor-pointer p-2 hover:bg-gray-100 dark:hover:bg-secondary-200 flex items-center">
        <input type="checkbox" [checked]="isSelected(option)"
          class="w-4 h-4 mr-2 bg-gray-100 checked:bg-primary-100 dark:checked:bg-primary-100 border-gray-300 rounded text-primary-600 focus:ring-primary-100" />
        {{ option.label | translate }}
      </li>
      }
    </ul>
  </div>
  }
</div>
