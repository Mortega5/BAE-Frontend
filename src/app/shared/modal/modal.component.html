<ng-template #dialog>
  <div class="flex justify-center p-4 pointer-events-none">
    <app-card variant="modal" class="w-full pointer-events-auto {{ width }}">
      <ng-content select="[appCardHeader]" ngProjectAs="[appCardHeader]"></ng-content>
      <ng-content></ng-content>
      <ng-content select="[appCardFooter]" ngProjectAs="[appCardFooter]"></ng-content>
    </app-card>
  </div>
</ng-template>
