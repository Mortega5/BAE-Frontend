<div class="relative flex items-center gap-[8px]">
  <span class="text-[14px] font-normal leading-[24px] text-content">{{ label | translate }}:</span>
  <button type="button" data-cy="sortToggle" (click)="toggle($event)" [attr.aria-expanded]="open" aria-haspopup="listbox"
    class="flex items-center gap-[4px] text-[14px] font-semibold leading-[16px] tracking-[0.5px] text-link">
    {{ selectedLabel | translate }}
    <fa-icon [icon]="chevron" class="inline-flex text-xs transition-transform" [ngClass]="open ? 'rotate-180' : ''" aria-hidden="true"></fa-icon>
  </button>
  @if (open) {
  <app-dropdown-panel (click)="$event.stopPropagation()" class="absolute right-0 sm:left-0 sm:right-auto top-full z-50 mt-2 w-[200px]" role="listbox">
    @for (option of options; track option.value) {
    <button type="button" role="option" [attr.data-cy]="'sort-' + option.value" [attr.aria-selected]="option.value === value"
      (click)="select(option, $event)"
      [ngClass]="option.value === value ? 'bg-surface-selected text-link' : 'text-content hover:bg-surface-hover'"
      class="flex w-full items-center px-3 py-2.5 text-[14px]">{{ option.label | translate }}</button>
    }
  </app-dropdown-panel>
  }
</div>
