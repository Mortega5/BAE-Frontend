<h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-6">
  {{ (formType === 'update' ? 'USAGE_SPECS._update' : 'USAGE_SPECS._create') | translate }}
</h1>

@if (loadingData) {
<app-loading-spinner />
} @else {
<form [formGroup]="usageSpecForm">
  <app-stepper [allUnlocked]="formType === 'update'" [canAdvance]="canAdvance"
    previousLabel="USAGE_SPECS._previous" nextLabel="USAGE_SPECS._next"
    [submitLabel]="formType === 'update' ? 'USAGE_SPECS._update' : 'USAGE_SPECS._create'"
    [submitAlwaysVisible]="formType === 'update'"
    [submitDisabled]="!usageSpecForm.controls['generalInfo'].valid"
    (stepChanged)="onStepChanged($event)" (submitted)="submitForm()">

    <ng-template stepperStep="USAGE_SPECS._general_info" stepId="generalInfo">
      <div class="flex flex-col gap-5">
        <div>
          <h2 class="text-2xl font-bold text-gray-900 dark:text-white">{{ 'USAGE_SPECS._general_info' | translate }}</h2>
          <p class="text-sm text-gray-600 dark:text-gray-400 mt-2">{{ 'USAGE_SPECS._general_info_desc' | translate }}</p>
        </div>
        <usage-spec-general-info [data]="usageSpec" [formType]="formType" [form]="usageSpecForm.controls['generalInfo']"
          (formChange)="handleSubformChange($event)">
        </usage-spec-general-info>
      </div>
    </ng-template>

    <ng-template stepperStep="USAGE_SPECS._metrics" stepId="metrics">
      <usage-spec-metrics [data]="usageSpec" [formType]="formType" formControlName="metrics"
        (formChange)="handleSubformChange($event)">
      </usage-spec-metrics>
    </ng-template>

    <ng-template stepperStep="USAGE_SPECS._summary" stepId="summary">
      <usage-spec-summary [usageSpecForm]="usageSpecForm"></usage-spec-summary>
    </ng-template>

  </app-stepper>
</form>
}

@if (showError) {
<div class="flex justify-center items-center fixed w-fit top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50">
  <div id="alert-additional-content-2" class="p-4 mb-4 text-red-800 border border-red-300 rounded-lg bg-red-50 dark:bg-red-900 dark:border-red-900 dark:text-white" role="alert">
    <div class="flex items-center">
      <svg class="flex-shrink-0 w-4 h-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
      </svg>
      <h3 class="text-lg font-medium">Error</h3>
    </div>
    <div class="mt-2 mb-4 text-sm">
      {{errorMessage}}
    </div>
  </div>
</div>
}
