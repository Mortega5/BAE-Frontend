<div class="flex flex-col gap-2">
  @if (!isReadonly) {
  <div class="flex gap-2 flex-wrap">
    <input type="number" [(ngModel)]="inputFrom" [placeholder]="fromPlaceholder | translate"
      (keyup.enter)="set()"
      class="bg-surface-input border border-line-input text-content text-sm rounded-lg p-2.5 flex-1 min-w-24" />
    <input type="number" [(ngModel)]="inputTo" [placeholder]="toPlaceholder | translate"
      (keyup.enter)="set()"
      class="bg-surface-input border border-line-input text-content text-sm rounded-lg p-2.5 flex-1 min-w-24" />
    <input type="text" [(ngModel)]="inputUnit" [placeholder]="unitPlaceholder | translate"
      (keyup.enter)="set()"
      class="bg-surface-input border border-line-input text-content text-sm rounded-lg p-2.5 w-28" />
    <app-button type="button" (click)="set()" [disabled]="!canSet" size="sm" class="whitespace-nowrap">
      {{ setLabel | translate }}
    </app-button>
  </div>
  }
  @if (current) {
  <span
    class="inline-flex items-center gap-1 px-2 py-1 text-xs rounded-full w-fit bg-info-soft text-info">
    {{ current.from }} – {{ current.to }} ({{ current.unit }})
    @if (!isReadonly) {
    <button type="button" (click)="clear()"
      class="ml-1 text-info hover:text-danger">✕</button>
    }
  </span>
  }
</div>
