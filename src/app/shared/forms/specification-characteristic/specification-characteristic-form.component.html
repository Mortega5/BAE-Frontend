<div class="flex flex-col gap-4">

  <app-dynamic-form [fields]="headerFields" [formGroup]="headerForm" [columns]="6" />

  @if (savedValues.length > 0) {
  <app-table-input [columns]="columns" [items]="savedValues" [selectable]="!readonly && !isSingleValueType"
    [multiple]="false" [readonly]="readonly" [ngModel]="defaultValue" (ngModelChange)="onDefaultChange($event)" />
  }

  @if (!readonly && valueType !== 'boolean' && !(isSingleValueType && savedValues.length > 0)) {
  <div
    class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 bg-gray-50 dark:bg-secondary-200 flex flex-col gap-3">
    <app-characteristic-value-spec-form [valueType]="valueType" [form]="valueForm" />
    <div class="flex justify-end">
      <button type="button"
        [attr.data-cy]="valueType === 'string' ? 'btnAddStringValue' : valueType === 'number' ? 'btnAddNumberValue' : valueType === 'range' ? 'btnAddRangeValue' : 'btnAddValue'"
        (click)="addValue()" [disabled]="!canAdd" [class.opacity-50]="!canAdd"
        [class.cursor-not-allowed]="!canAdd"
        class="flex items-center gap-2 text-white bg-primary-100 hover:bg-primary-50 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2">
        {{ 'CHAR_SPEC._add_value' | translate }}
        <fa-icon [icon]="faPlus" aria-hidden="true"></fa-icon>
      </button>
    </div>
  </div>
  }

</div>
