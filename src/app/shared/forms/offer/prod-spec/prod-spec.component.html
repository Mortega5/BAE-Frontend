@if(bundleChecked){
<div class="flex justify-center w-full m-4">
  <div
    class="flex w-full items-center p-4 text-sm text-primary-100 rounded-lg bg-blue-50 dark:bg-secondary-200 dark:text-primary-50"
    role="alert">
    <svg class="flex-shrink-0 inline w-4 h-4 me-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
      fill="currentColor" viewBox="0 0 20 20">
      <path
        d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z" />
    </svg>
    <span class="sr-only">Info</span>
    <div>
      {{ 'CREATE_OFFER._no_prod_spec' | translate }}
    </div>
  </div>
</div>
} @else{
@if(isEditMode){
@if(selectedProdSpecInternal){
<div class="w-full mt-4 mb-4">
  <app-table-input data-cy="prodSpecs" [columns]="prodColumns" [items]="[selectedProdSpecInternal]" [multiple]="false"
    [readonly]="true" [ngModel]="selectedProdSpecInternal">
  </app-table-input>
</div>
}
} @else {
<div class="w-full mt-4 mb-4">
  <app-paginated-table data-cy="prodSpecs" [columns]="prodColumns" [fetchPage]="fetchProdSpecs" [multiple]="false"
    [selectable]="true" [selected]="selectedProdSpecInternal" (selectedChange)="onProdSpecChange($event)">
  </app-paginated-table>
</div>
}
}
