<h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-6">
  {{ 'CREATE_OFFER._create' | translate }}
</h1>

@if(notFound){
    <app-not-found-state message="This offer could not be found." (back)="goBack()" />
} @else if(loadingData){
    <app-loading-spinner />
} @else {
  <form [formGroup]="productOfferForm">
      <app-stepper [canAdvance]="canAdvance" [loading]="loading" submitLabel="CREATE_OFFER._create"
        [submitDisabled]="loading" (stepChanged)="onStepChanged($event)" (submitted)="createOffer()">

        <ng-template stepperStep="Party Info">
          <app-related-party-id formControlName="partyInfo" [partyId]="partyId"></app-related-party-id>
        </ng-template>

        <ng-template stepperStep="Price Plans">
          <app-price-plans-form
            [form]="productOfferForm"
            [prodSpec]="productOfferForm.get('prodSpec')?.value"
            [custom]="true">
          </app-price-plans-form>
        </ng-template>

        <ng-template stepperStep="Procurement Mode">
          <app-procurement-mode [data]="offer"
            [form]="productOfferForm.controls['procurementMode']">
          </app-procurement-mode>
        </ng-template>

      </app-stepper>
    </form>
  }

  @if(showError){
    <div class="flex justify-center items-center fixed w-fit top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50">
      <div id="alert-additional-content-2" class="p-4 mb-4 text-red-800 border border-red-300 rounded-lg bg-red-50 dark:bg-red-900 dark:border-red-900 dark:text-white" role="alert">
        <div class="flex items-center">
          <svg class="flex-shrink-0 w-4 h-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
          </svg>
          <h3 class="text-lg font-medium">Error</h3>
        </div>
        <div class="mt-2 mb-4 text-sm">
          {{errorMessage}}
        </div>
      </div>
    </div>
  }
