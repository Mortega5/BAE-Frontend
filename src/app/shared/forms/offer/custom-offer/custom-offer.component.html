<h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-6">
  {{ 'CREATE_OFFER._create' | translate }}
</h1>

@if(notFound){
    <app-not-found-state message="CREATE_OFFER._not_found" (back)="goBack()" />
} @else if(loadingData){
    <app-loading-spinner />
} @else {
  <form [formGroup]="productOfferForm">
      <app-stepper [canAdvance]="canAdvance" [loading]="loading" submitLabel="CREATE_OFFER._create"
        [submitDisabled]="loading" (stepChanged)="onStepChanged($event)" (submitted)="askPublishOrDraft()">

        <ng-template stepperStep="CREATE_OFFER._step_party_info">
          <app-related-party-id formControlName="partyInfo" [partyId]="partyId"></app-related-party-id>
        </ng-template>

        <ng-template stepperStep="CREATE_OFFER._step_price_plans">
          <app-price-plans-form
            [form]="productOfferForm"
            [prodSpec]="productOfferForm.get('prodSpec')?.value"
            [custom]="true">
          </app-price-plans-form>
        </ng-template>

        <ng-template stepperStep="CREATE_OFFER._step_procurement_mode">
          <app-procurement-mode [data]="offer"
            [form]="productOfferForm.controls['procurementMode']">
          </app-procurement-mode>
        </ng-template>

      </app-stepper>
    </form>
  }

<app-confirm-modal [visible]="showPublishDraftModal" [title]="'PUBLISH_DRAFT_MODAL._title'"
  message="PUBLISH_DRAFT_MODAL._message" cancelLabel="PUBLISH_DRAFT_MODAL._save_draft"
  confirmLabel="PUBLISH_DRAFT_MODAL._publish" confirmVariant="primary" (resolved)="$event ? publish() : saveDraft()"
  (closed)="showPublishDraftModal = false" />
