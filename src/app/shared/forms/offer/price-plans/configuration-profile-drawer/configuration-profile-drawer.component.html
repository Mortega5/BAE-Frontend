<app-modal [visible]="true" width="md:w-5/6 max-w-3xl" (closed)="cancel()">
  <div appCardHeader class="flex justify-between items-center">
    <h2 class="text-2xl font-bold text-content">
      {{ 'FORMS.PRICE_PLANS._configure_profile_chars' | translate }}
    </h2>
    <app-button type="button" (click)="cancel()" variant="ghost" size="sm" prefixIcon="xmark" />
  </div>

    @if(fields.length>0){
      <app-card>
        <app-dynamic-form [fields]="fields" [formGroup]="form" [columns]="2" />
      </app-card>
    } @else {
      <div class="p-4 my-2 text-sm text-center text-primary-100 dark:text-primary-50 rounded-lg bg-info-soft" role="alert">
        <span class="font-medium">{{ 'FORMS.PRICE_PLANS._prod_spec_no_chars' | translate }}</span>
      </div>
    }

    @if(fields.length>0){
      <div appCardFooter class="flex justify-end gap-3">
        <app-button data-cy="offerProfileCancel" type="button" (click)="cancel()" variant="ghost">{{ 'FORMS.PRICE_PLANS._cancel' | translate }}</app-button>
        <app-button data-cy="offerProfileSave" type="button" (click)="saveProfile()" [disabled]="form.invalid">
          {{ 'FORMS.PRICE_PLANS._save' | translate }}
        </app-button>
      </div>
    }
</app-modal>
