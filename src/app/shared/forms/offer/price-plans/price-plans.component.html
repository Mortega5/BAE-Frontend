<div class="flex flex-col gap-5">
  <div>
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">{{ 'CREATE_OFFER._price_plans' | translate }}</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400 mt-2">{{ 'CREATE_OFFER._step4_subtitle' | translate }}</p>
  </div>

  <!-- Price tier picker -->
  <div class="flex flex-col">
    @if (pricePlans.length == 0) {
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <button type="button" data-cy="pricePlanTypeFree" (click)="selectPriceTier('free')"
        [ngClass]="priceType === 'free'
          ? 'bg-[var(--card-selected-bg)] border-[var(--card-selected-border)]'
          : 'bg-[var(--card-bg)] border-[var(--card-border)] hover:border-[var(--card-hover-border)]'"
        class="flex flex-col text-left gap-2 rounded-2xl border p-5 transition-colors">
        <h3 class="text-base font-semibold text-gray-900 dark:text-white">{{ 'CREATE_OFFER._price_tier_free' | translate }}</h3>
        <p class="text-sm text-gray-600 dark:text-gray-400">{{ 'CREATE_OFFER._price_tier_free_desc' | translate }}</p>
      </button>
      @if(!custom){
      <button type="button" data-cy="pricePlanTypeTailored" (click)="selectPriceTier('tailored')"
        [ngClass]="priceType === 'tailored'
          ? 'bg-[var(--card-selected-bg)] border-[var(--card-selected-border)]'
          : 'bg-[var(--card-bg)] border-[var(--card-border)] hover:border-[var(--card-hover-border)]'"
        class="flex flex-col text-left gap-2 rounded-2xl border p-5 transition-colors">
        <h3 class="text-base font-semibold text-gray-900 dark:text-white">{{ 'CREATE_OFFER._price_tier_tailored' | translate }}</h3>
        <p class="text-sm text-gray-600 dark:text-gray-400">{{ 'CREATE_OFFER._price_tier_tailored_desc' | translate }}</p>
      </button>
      }
      <button type="button" data-cy="pricePlanTypePaid" (click)="selectPriceTier('paid')"
        [ngClass]="priceType === 'paid'
          ? 'bg-[var(--card-selected-bg)] border-[var(--card-selected-border)]'
          : 'bg-[var(--card-bg)] border-[var(--card-border)] hover:border-[var(--card-hover-border)]'"
        class="flex flex-col text-left gap-2 rounded-2xl border p-5 transition-colors">
        <h3 class="text-base font-semibold text-gray-900 dark:text-white">{{ 'CREATE_OFFER._price_tier_online' | translate }}</h3>
        <p class="text-sm text-gray-600 dark:text-gray-400">{{ 'CREATE_OFFER._price_tier_online_desc' | translate }}</p>
      </button>
    </div>
    } @else {
    <label class="text-sm text-gray-600 dark:text-gray-400">
      <span class="font-semibold text-gray-900 dark:text-white">
        {{
        priceType === 'free' ? ('CREATE_OFFER._price_tier_free' | translate) :
        priceType === 'tailored' ? ('CREATE_OFFER._price_tier_tailored' | translate) :
        ('CREATE_OFFER._price_tier_online' | translate)
        }}
      </span>
      &mdash; {{ 'FORMS.PRICE_PLANS._locked_after_first_plan' | translate }}
    </label>
    }

  </div>

  @if(priceType!='free'){
  <!-- Price Plans Table -->
  <app-price-plans-table [pricePlans]="pricePlans" (edit)="editPricePlan($event)" (delete)="removePricePlan($event)">
  </app-price-plans-table>

  <!-- Add Price Plan Button -->
  <app-button data-cy="newPricePlan" type="button" (click)="openPricePlanDrawer()" variant="secondary" prefixIcon="plus">
    {{ 'FORMS.PRICE_PLANS._add' | translate }}
  </app-button>
  }

</div>

<!-- Standard/Flex Choice Modal -->
@if (showSubtypeModal) {
<app-plan-subtype-modal (select)="onSubtypeSelected($event)" (closed)="closeSubtypeModal()">
</app-plan-subtype-modal>
}

<!-- Price Plan Drawer -->
@if (showDrawer) {
<app-price-plan-drawer data-cy="pricePlanDrawer" [formGroup]="selectedPricePlan" [prodSpec]="prodSpec" [action]="action"
  (save)="savePricePlan($event)" (close)="closeDrawer()">
</app-price-plan-drawer>
}
