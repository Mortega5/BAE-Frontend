<app-modal [visible]="true" width="max-w-2xl" (closed)="cancel()">
  <div appCardHeader class="flex justify-between items-start">
    <h2 class="text-2xl font-bold text-content">
      {{ 'CREATE_OFFER._add_new_price_plan' | translate }}
    </h2>
    <app-button type="button" (click)="cancel()" variant="ghost" size="sm" prefixIcon="xmark" />
  </div>
  <p class="text-sm text-content-muted mb-6">
    {{ 'CREATE_OFFER._select_plan_type' | translate }}
  </p>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <button type="button" (click)="pick('standard')" data-cy="planSubtypeStandard"
      [disabled]="!standardAvailable"
      [attr.aria-describedby]="!standardAvailable ? 'standardPlanConfigurationHint' : null"
      [class.is-selected]="selectedType === 'standard'"
      class="option-card flex flex-col text-left gap-2 rounded-2xl border p-5 transition-colors disabled:cursor-not-allowed disabled:opacity-60">
      <h3 class="text-base font-semibold text-content">{{ 'CREATE_OFFER._standard_plan' | translate }}</h3>
      <p class="text-sm text-content-muted">{{ 'CREATE_OFFER._standard_plan_desc' | translate }}</p>
      @if (!standardAvailable) {
      <p id="standardPlanConfigurationHint" data-cy="standardPlanConfigurationHint" class="text-xs text-content-muted">
        {{ 'CREATE_OFFER._standard_plan_requires_configuration_options' | translate }}
      </p>
      }
    </button>

    <button type="button" (click)="pick('flex')" data-cy="planSubtypeFlex"
      [class.is-selected]="selectedType === 'flex'"
      class="option-card flex flex-col text-left gap-2 rounded-2xl border p-5 transition-colors">
      <h3 class="text-base font-semibold text-content">{{ 'CREATE_OFFER._flex_plan' | translate }}</h3>
      <p class="text-sm text-content-muted">{{ 'CREATE_OFFER._flex_plan_desc' | translate }}</p>
    </button>
  </div>

  <div appCardFooter>
    <app-button type="button" (click)="cancel()" variant="ghost">
      {{ 'CREATE_OFFER._cancel' | translate }}
    </app-button>
    <app-button type="button" data-cy="planSubtypeContinue" (click)="confirm()" [disabled]="!selectedType">
      {{ 'CREATE_OFFER._continue' | translate }}
    </app-button>
  </div>
</app-modal>
