<div class="flex flex-col gap-5">
  <app-dynamic-form [fields]="fields" [formGroup]="formGroup" [columns]="2"></app-dynamic-form>
  <app-dynamic-form [fields]="descriptionFields" [formGroup]="formGroup" [columns]="1"></app-dynamic-form>
</div>

<app-modal data-cy="createCatalogModal" [visible]="showCreateCatalogModal" width="max-w-7xl"
  (closed)="closeCreateCatalogModal()">
  <div appCardHeader class="flex items-center justify-between">
    <h3 class="text-xl font-bold text-content">{{ 'CREATE_CATALOG._new' | translate }}</h3>
    <app-button type="button" (click)="closeCreateCatalogModal()" variant="ghost" size="sm" prefixIcon="xmark" />
  </div>

  @if (showCreateCatalogModal) {
  <create-catalog [embedded]="true" [initialName]="newCatalogName" (created)="onCatalogCreated($event)"
    (cancelled)="closeCreateCatalogModal()" />
  }
</app-modal>
