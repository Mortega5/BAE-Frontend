<div class="col-span-2 flex flex-col gap-5">
  <label class="flex items-start gap-3 p-4 rounded-lg border border-gray-200 dark:border-secondary-200 cursor-pointer">
    <input type="checkbox" id="dsp-compatible" [formControl]="dspCompatibleControl"
      class="mt-1 w-4 h-4 text-primary-100 focus:ring-primary-100 rounded"/>
    <span class="flex flex-col">
      <span class="text-sm font-semibold text-gray-900 dark:text-white">{{ 'CREATE_OFFER._dsp_contract_enabled' | translate }}</span>
      <span class="text-xs text-gray-500 dark:text-gray-400">{{ 'CREATE_OFFER._dsp_contract_enabled_desc' | translate }}</span>
    </span>
  </label>
  @if(dspCompatible) {
  <app-dynamic-form class="block animate-stepIn" [fields]="policyFormFields" [formGroup]="formGroup" [columns]="1" />
  }
</div>
