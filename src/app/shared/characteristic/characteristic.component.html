@if (!readOnly){
<!-- Nombre y descripción -->
<div class="my-2">
  <h4 class="text-lg font-semibold text-primary-100 dark:text-gray-300">{{ characteristic.name }}</h4>
  <markdown [ngClass]="{
        'break-all': hasLongWord(characteristic.description, 20),
        'break-words': !hasLongWord(characteristic.description, 20)
        }" class="text-gray-500 dark:text-gray-400 text-wrap break-words line-clamp-4"
    [data]="characteristic.description"></markdown>
</div>
@if(!isDisabled){
<app-dynamic-form [fields]="fields" [formGroup]="formGroup" [columns]="3"></app-dynamic-form>
}

} @else {
<div class="grid grid-cols-2 items-center">
  <div class="text-base font-semibold text-primary-100 dark:text-gray-400 flex justify-between content-center">{{
    characteristic.name }}:</div>
  <span class="pl-4 min-w-24 flex text-sm text-gray-600 dark:text-gray-400">{{ control.value }} {{ getUnit() }}</span>
</div>
}
