@if (!readOnly){
<!-- Nombre y descripción -->
<div class="my-2">
  <h4 class="text-lg font-semibold text-primary-100 dark:text-content-secondary">{{ characteristic.name }}</h4>
  <markdown [ngClass]="{
        'break-all': hasLongWord(characteristic.description, 20),
        'break-words': !hasLongWord(characteristic.description, 20)
        }" class="text-content-muted text-wrap break-words line-clamp-4"
    [data]="characteristic.description"></markdown>
</div>
@if(!isDisabled){
<app-dynamic-form [fields]="fields" [formGroup]="formGroup" [columns]="3"></app-dynamic-form>
}

} @else {
<div class="flex items-start gap-2 w-full">
  <fa-icon [icon]="faLock" class="w-3 h-3 mt-1 text-content-muted shrink-0" aria-hidden="true"></fa-icon>
  <div class="min-w-0">
    <div [title]="characteristic.name"
      class="text-xs font-medium uppercase tracking-wide text-content-muted truncate">{{
      characteristic.name }}</div>
    <div class="text-sm font-semibold text-content break-words">{{ control.value }} {{ getUnit()
      }}</div>
  </div>
</div>
}
