<div class="relative inline-grid rounded-xl border border-line bg-surface-muted p-1 shadow-inner" role="group"
  [style.grid-template-columns]="'repeat(' + options.length + ', minmax(0, 1fr))'"
  [attr.aria-label]="label ? (label | translate) : null" [attr.data-cy]="dataCy">
  <!-- The chosen option: a raised piece that slides over the track -->
  <span aria-hidden="true" data-cy="segmentedToggleThumb"
    class="absolute bottom-1 left-1 top-1 rounded-lg bg-primary-100 shadow-md transition-transform duration-300 ease-out motion-reduce:transition-none"
    [style.width]="'calc((100% - 0.5rem) / ' + options.length + ')'"
    [style.transform]="'translateX(' + selectedIndex * 100 + '%)'"></span>
  @for (option of options; track option.value) {
  <button type="button" [attr.data-cy]="option.dataCy" [attr.aria-pressed]="option.value === value" (click)="select(option)"
    class="relative z-10 rounded-lg px-4 py-1.5 text-sm font-semibold transition-colors duration-300 focus:outline-none focus-visible:ring-4 focus-visible:ring-primary-100/30"
    [ngClass]="option.value === value ? 'text-on-primary' : 'text-content-secondary hover:text-content'">
    {{ option.label | translate }}
  </button>
  }
</div>
