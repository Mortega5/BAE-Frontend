<button class="app-button" [type]="type" [disabled]="disabled" [attr.data-cy]="dataCy || null"
  [attr.data-variant]="variant" [attr.data-size]="size" [attr.data-shape]="shape"
  [attr.data-outline]="outline ? '' : null">
  @if (resolvedIcon && iconPosition === 'prefix') {
  <fa-icon [icon]="resolvedIcon" />
  }
  <ng-content></ng-content>
  @if (resolvedIcon && iconPosition === 'suffix') {
  <fa-icon [icon]="resolvedIcon" />
  }
</button>
