<div
  class="flex flex-col items-center justify-center text-center py-16 px-4 mt-4 bg-secondary-50 dark:bg-secondary-100 border border-secondary-50 dark:border-gray-800 rounded-lg">
  <svg class="w-12 h-12 text-gray-400 dark:text-gray-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
      d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
  <p class="text-lg font-medium text-gray-700 dark:text-white mb-4">{{ message }}</p>
  <button type="button" (click)="back.emit()"
    class="px-4 py-2 text-sm font-medium text-white bg-primary-100 rounded-lg hover:bg-primary-200">
    {{ backLabel }}
  </button>
</div>
