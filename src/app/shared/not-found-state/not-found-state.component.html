<div
  class="flex flex-col items-center justify-center text-center py-16 px-4 mt-4 bg-[var(--card-bg)] border border-[var(--card-border)] rounded-lg">
  <fa-icon [icon]="faCircleXmark" class="mb-4 text-5xl text-[var(--form-hint-text)]" aria-hidden="true"></fa-icon>
  <p class="text-lg font-medium text-[var(--theme-default-text)] mb-4">{{ message | translate }}</p>
  <app-button type="button" (click)="back.emit()">
    {{ backLabel | translate }}
  </app-button>
</div>
