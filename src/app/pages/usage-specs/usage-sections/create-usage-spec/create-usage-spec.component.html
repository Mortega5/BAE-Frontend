<div>
  <!-- Breadcrumb -->
  <div class="p-4">
    <nav
      class="flex px-5 py-3 text-gray-700 border border-gray-200 rounded-lg bg-secondary-50 dark:bg-secondary-100 dark:border-gray-800 dark:text-white"
      aria-label="Breadcrumb">
      <ol class="inline-flex items-center space-x-1 md:space-x-2 rtl:space-x-reverse">
        <li class="inline-flex items-center">
          <app-button (click)="goBack()" variant="link" prefixIcon="chevron-left">
            {{ 'USAGE_SPECS._back' | translate }}
          </app-button>
        </li>
        <li aria-current="page">
          <div class="flex items-center">
            <svg class="rtl:rotate-180  w-3 h-3 mx-1 text-gray-400 dark:text-white" aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m1 9 4-4-4-4" />
            </svg>
            <span class="ms-1 text-sm font-medium text-gray-500 dark:text-white md:ms-2 ">{{ 'USAGE_SPECS._create' |
              translate }}</span>
          </div>
        </li>
      </ol>
    </nav>
  </div>
  <!-- End Breadcrumb -->

  <usage-spec-form [partyId]="partyId" [formType]="'create'"></usage-spec-form>
</div>
