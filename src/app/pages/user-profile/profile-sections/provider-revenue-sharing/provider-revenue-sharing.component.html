<app-card>
  <div appCardHeader>
    <h2 class="text-2xl font-bold text-content">{{ 'PROFILE._revenue' | translate }}</h2>
    <p class="mt-1 text-sm text-content-muted">{{ 'PROFILE._revenue_subtitle' | translate }}</p>
  </div>
  <div appCardContent>
    @if (loading) {
    <app-loading-spinner containerClass="h-full flex justify-center align-middle" />
    } @else {

    @for (section of report; track section) {
    <app-card variant="inset" class="mb-4 block last:mb-0">
      <div appCardContent>
        <app-revenue-report [node]="section"></app-revenue-report>
      </div>
    </app-card>
    }

    }
    @if(showError){
    <div
      class="flex justify-center items-center fixed w-fit top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50">
      <div id="alert-additional-content-2"
        class="p-4 mb-4 text-danger border border-danger-border rounded-lg bg-danger-soft"
        role="alert">
        <div class="flex items-center">
          <svg class="flex-shrink-0 w-4 h-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
            fill="currentColor" viewBox="0 0 20 20">
            <path
              d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z" />
          </svg>
          <h3 class="text-lg font-medium">Error</h3>
        </div>
        <div class="mt-2 mb-4 text-sm">
          {{errorMessage}}
        </div>
      </div>
    </div>
    }
  </div>
</app-card>
