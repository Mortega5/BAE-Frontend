@if (loading) {
<app-loading-spinner containerClass="w-3/4 md:w-4/5 h-full flex justify-center align-middle" />
} @else {
<div class="mb-6">
  <h2 class="text-2xl font-bold text-content">{{ 'PROFILE._general' | translate }}</h2>
  <p class="mt-1 text-sm text-content-muted">{{ 'PROFILE._general_user_subtitle' | translate }}</p>
</div>

<div class="flex flex-col gap-6">
  <app-card>
    <div appCardHeader>
      <h3 class="text-xl font-bold text-content">{{ 'PROFILE._account' | translate }}</h3>
    </div>
    <app-dynamic-form class="block" [fields]="accountFields" [formGroup]="accountForm" [columns]="2" />
  </app-card>

  <app-card>
    <div appCardHeader>
      <h3 class="text-xl font-bold text-content">{{ 'PROFILE._personal_info' | translate }}</h3>
    </div>
    <app-dynamic-form class="block" [fields]="profileFields" [formGroup]="userProfileForm" [columns]="6" />
  </app-card>

  <app-card>
    <div appCardHeader>
      <h3 class="text-xl font-bold text-content">{{ 'PROFILE._birthdate' | translate }}</h3>
    </div>
    <app-dynamic-form class="block" [fields]="birthdateFields" [formGroup]="userProfileForm" [columns]="2" />
  </app-card>

  <div class="flex justify-end">
    <app-button type="button" [disabled]="!userProfileForm.valid" (click)="updateProfile()">
      {{ 'PROFILE._update' | translate }}
    </app-button>
  </div>
</div>
}
