<app-card>
  <div appCardHeader>
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">{{ 'ADMIN._revenue' | translate }}</h2>
  </div>
  <div appCardContent>
    @if (loading) {
    <app-loading-spinner containerClass="w-full h-full flex justify-center align-middle" />
    } @else {
    <div class="flex flex-col gap-4">
      @for(item of items; track item){
      <app-card>
        <div appCardContent>
          <h3 class="text-gray-900 dark:text-white text-xl font-normal mb-2">{{item.title}}</h3>
          <p class="text-base font-normal text-gray-500 dark:text-gray-400">{{ item.description }}</p>
        </div>
      </app-card>
      }
    </div>
    }
  </div>
</app-card>
