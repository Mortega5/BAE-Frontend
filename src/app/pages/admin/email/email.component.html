<app-card>
  <div appCardHeader>
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">{{ 'ADMIN._email' | translate }}</h2>
  </div>
  <div appCardContent>
    <app-dynamic-form class="block" [fields]="emailFormFields" [formGroup]="emailForm" />

    <h3 class="mt-6 mb-4 font-bold text-lg text-gray-900 dark:text-white">{{ 'ADMIN._contactUsDestinations' | translate }}</h3>
    <app-dynamic-form class="block" [fields]="contactUsFormFields" [formGroup]="emailForm" />
  </div>
  <div appCardFooter>
    <app-button data-cy="adminAddCredential" type="button" (click)="addConfig();" suffixIcon="arrow-right">
      {{ 'ADMIN._add' | translate }}
    </app-button>
  </div>
</app-card>

@if(showError){
<error-message
  class="flex justify-center items-center fixed w-fit top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50"
  [message]="errorMessage"></error-message>
}

@if(showSuccess){
<div
  class="flex justify-center items-center fixed w-fit top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50">
  <div class="p-4 mb-4 text-white rounded-lg bg-primary-100" role="alert">
    <div class="flex items-center">
      <svg class="flex-shrink-0 w-4 h-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
        viewBox="0 0 20 20">
        <path
          d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z" />
      </svg>
      <h3 class="text-lg font-medium">{{ 'ADMIN._updateSuccessTitle' | translate }}</h3>
    </div>
    <div class="mt-2 text-sm pr-8 pl-8">
      {{ successMessage | translate }}
    </div>
  </div>
</div>
}
