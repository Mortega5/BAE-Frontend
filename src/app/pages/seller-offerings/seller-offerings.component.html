<div class="min-h-[calc(100vh-88px)]">
  <div class="container mx-auto pt-4 pb-8">
    <app-side-nav [sections]="sections" [title]="'OFFERINGS._my_offerings'" mobileLabel="OFFERINGS._offerings"
      [showDesktopSidebar]="isListView">
      <router-outlet></router-outlet>

      <ng-container sideNavFooter>
        @if (workspaceHelpAction; as helpAction) {
        <div data-cy="sellerWorkspaceHelp" class="mt-auto pt-8 pb-2 px-2 lg:sticky lg:bottom-2">
          <div
            class="p-5 bg-surface rounded-2xl border border-line shadow-sm">
            <h3 class="text-base font-bold text-content mb-1.5">{{ helpAction.title | translate }}</h3>
            <p class="text-sm text-content-secondary mb-3">{{ helpAction.description | translate }}</p>
            <app-button type="button" (click)="goToResources()" variant="neutral" class="w-full">
              {{ helpAction.actionLabel | translate }}
            </app-button>
          </div>
        </div>
        }
      </ng-container>
    </app-side-nav>
  </div>
</div>
