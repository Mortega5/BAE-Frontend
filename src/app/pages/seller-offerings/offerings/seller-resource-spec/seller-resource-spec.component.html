<div>
  <div
    class="w-full h-fit mb-4 bg-secondary-50 rounded-lg dark:bg-secondary-100 dark:border-gray-800 border-gray-300
    border-secondary-50 border flex flex-col shadow-lg">
    <div class="flex w-full flex-cols items-center md:flex-row justify-between">
      <div class="mb-4 md:mb-0 md:w-1/4 p-8">
        <h2 class="text-2xl font-bold mb-4 dark:text-white">{{ 'OFFERINGS._res_spec' | translate }}</h2>
      </div>

      <div class="flex flex-row w-full justify-end">
        <button data-cy="createResSpec" (click)="goToCreate()" type="button"
          class="ml-2 mr-8 mb-4 text-white bg-primary-100 hover:bg-primary-50 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm p-2.5 text-center inline-flex items-center align-middle me-2">
          <p class="pl-2 pr-2">{{ 'OFFERINGS._add_new_res' | translate }}</p>
          <svg class="w-[18px] h-[18px] text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
            height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5 12h14m-7 7V5" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div
    class="bg-secondary-50 dark:bg-secondary-100 dark:border-gray-800 border-secondary-50 border mt-8 p-4 rounded-lg shadow-lg">
    <app-filtered-paginated-table data-cy="resSpecTable" [columns]="resSpecColumns" [fetchPage]="fetchResSpecs"
      [filters]="resSpecFilters" [filterColumns]="1" [clickable]="true" (rowClick)="goToUpdate($event)"
      [defaultSort]="defaultSort">
    </app-filtered-paginated-table>
  </div>
</div>
