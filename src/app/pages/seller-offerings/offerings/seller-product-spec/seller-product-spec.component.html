<div>
  <div
    class="bg-secondary-50 dark:bg-secondary-100 dark:border-gray-800 border-secondary-50 border mt-8 px-8 py-12 rounded-lg shadow-lg">
    <div class="mb-24 flex w-full flex-cols items-center md:flex-row justify-between">
      <h2 class="text-2xl font-bold dark:text-white">{{ 'OFFERINGS._prod_spec' | translate }}</h2>

      <button data-cy="createProdSpec" (click)="goToCreate()" type="button"
        class="text-white bg-primary-100 hover:bg-primary-50 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm p-2.5 text-center inline-flex items-center align-middle me-2">
        <p class="hidden lg:block pl-2 pr-2">{{ 'OFFERINGS._add_new_prod' | translate }}</p>
        <p class="block lg:hidden pl-2 pr-2">{{ 'OFFERINGS._add_new_prod_short' | translate }}</p>
        <svg class="w-[18px] h-[18px] text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
          height="24" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 12h14m-7 7V5" />
        </svg>
      </button>
    </div>
    <app-filtered-paginated-table data-cy="prodSpecTable" [columns]="prodSpecColumns" [fetchPage]="fetchProdSpecs"
      [filters]="prodSpecFilters" [filterColumns]="1" [clickable]="true" (rowClick)="goToUpdate($event.id)"
      [defaultSort]="defaultSort">
    </app-filtered-paginated-table>
  </div>
</div>
