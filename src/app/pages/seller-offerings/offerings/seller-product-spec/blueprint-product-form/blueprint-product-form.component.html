<div class="flex flex-col gap-10">

  <!-- Section: Orchestration Plan -->
  <div>
    <h3 class="text-xl font-semibold text-gray-800 dark:text-white mb-4">
      {{ 'BLUEPRINT_PROD._orchestration_plan' | translate }}
    </h3>

    <!-- Steps table -->
    @if (orchestrationSteps.length > 0) {
    <app-table-input [columns]="stepsTableColumns" [items]="orchestrationSteps" [selectable]="false"></app-table-input>
    } @else {
    <div
      class="flex w-full items-center p-4 text-sm text-red-700 rounded-lg bg-red-50 dark:bg-secondary-200 dark:text-red-400"
      role="alert">
      <svg class="flex-shrink-0 inline w-4 h-4 me-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
        fill="currentColor" viewBox="0 0 20 20">
        <path
          d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z" />
      </svg>
      {{ 'BLUEPRINT_PROD._no_steps' | translate }}
    </div>
    }

    <!-- Toggle / Step form -->
    @if (showStepForm) {
    <div class="bg-white dark:bg-secondary-300 border border-gray-200 dark:border-gray-700 rounded-lg p-4 mt-4">
      <app-dynamic-form [fields]="stepFormFields" [formGroup]="stepForm" [columns]="6" />

      @if (cycleError) {
      <div
        class="flex items-start gap-2 mt-3 p-3 text-sm text-red-700 bg-red-50 rounded-lg dark:bg-secondary-200 dark:text-red-400"
        role="alert">
        <svg class="w-4 h-4 flex-shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
          viewBox="0 0 20 20">
          <path
            d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z" />
        </svg>
        <span class="flex flex-col gap-1">
          {{ 'BLUEPRINT_PROD._cycle_error' | translate }}
          <span class="font-mono font-semibold">{{ cycleError.join(' → ') }}</span>
        </span>
      </div>
      }
      <div class="flex gap-3 mt-4 justify-end">
        <button type="button" (click)="cancelEdit()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 dark:bg-secondary-300 dark:text-white dark:border-gray-600 dark:hover:bg-secondary-200">
          {{ 'BLUEPRINT_PROD._cancel' | translate }}
        </button>
        <button type="button" (click)="addOrUpdateStep()" [disabled]="stepForm.invalid"
          [ngClass]="stepForm.invalid ? 'opacity-50 cursor-not-allowed' : 'hover:bg-primary-50'"
          class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-primary-100 rounded-lg focus:ring-4 focus:outline-none focus:ring-blue-300">
          @if (editingIndex !== null) {
          {{ 'BLUEPRINT_PROD._update_step' | translate }}
          } @else {
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5 12h14m-7 7V5" />
          </svg>
          {{ 'BLUEPRINT_PROD._add_step' | translate }}
          }
        </button>
      </div>
    </div>
    } @else {
    <div class="flex w-full justify-center mt-4">
      <button type="button" (click)="showStepForm = true"
        class="flex items-center gap-2 text-white bg-primary-100 hover:bg-primary-50 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5">
        <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 12h14m-7 7V5" />
        </svg>
        {{ 'BLUEPRINT_PROD._add_step' | translate }}
      </button>
    </div>
    }

  </div>

</div>
