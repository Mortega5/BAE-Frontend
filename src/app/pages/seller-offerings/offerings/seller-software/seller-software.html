<app-card>
  <div appCardHeader class="flex w-full flex-cols items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-content">{{ 'OFFERINGS._softwares' | translate }}</h2>
      <p class="text-sm text-content-muted mt-1">{{ 'OFFERINGS._manage_software_subtitle' | translate }}
      </p>
    </div>

    <app-button dataCy="newSoftware" (click)="goToCreate()" prefixIcon="plus">
      {{ 'OFFERINGS._add_new_software' | translate }}
    </app-button>
  </div>
  <app-filtered-paginated-table data-cy="softwareTable" [columns]="softwareColumns" [fetchPage]="fetchSoftware"
    [filters]="softwareFilters" [filterColumns]="1" [clickable]="true" (rowClick)="goToUpdate($event.id)"
    [defaultSort]="defaultSort">
  </app-filtered-paginated-table>
</app-card>
