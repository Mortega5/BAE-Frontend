<div class="w-full flex-1 flex flex-col">
  <!-- Breadcrumb -->
  <div class="p-4">
    <button (click)="goBack()"
      class="inline-flex items-center text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-primary-100 dark:hover:text-primary-50">
      <svg class="w-3 h-3 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 12 10">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
          d="M5 1 1 5l4 4m6-8L7 5l4 4" />
      </svg>
      {{ 'CREATE_SOFTWARE._back' | translate }}
    </button>
  </div>
  <!-- End Breadcrumb -->

  <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-6">{{ 'UPDATE_SOFTWARE._edit' | translate }}</h1>

  @if (notFound) {
  <app-not-found-state message="This software resource could not be found." (back)="goBack()" />
  } @else {
  <app-stepper [allUnlocked]="true" [canAdvance]="canAdvance" submitLabel="UPDATE_SOFTWARE._update"
    [submitDisabled]="!generalForm.valid || loading" (stepChanged)="onStepChanged($event)"
    (submitted)="updateSoftware()" [submitAlwaysVisible]="true">

    <ng-template stepperStep="General Info" stepId="general">
      <app-dynamic-form class="block m-4" [fields]="generalFormFields" [formGroup]="generalForm" />
    </ng-template>

    <ng-template stepperStep="Software Specification" stepId="software">
      <app-dynamic-form class="block m-4" [fields]="softwareSpecFields" [formGroup]="softwareSpecForm" />
    </ng-template>

    <ng-template stepperStep="Characteristics" stepId="characteristics">
      <app-software-characteristics [readonly]="false" class="block m-4"
        [(characteristics)]="resourceCharacteristics" />
    </ng-template>

  </app-stepper>
  }
</div>
