<app-card>
  <div appCardHeader class="flex w-full flex-cols items-center md:flex-row justify-between">
    <div>
      <h2 class="text-2xl font-bold text-content">{{ 'DATASETS._list_title' | translate }}</h2>
      <p class="text-sm text-content-muted mt-1">{{ 'DATASETS._list_subtitle' | translate }}</p>
    </div>

    <app-button dataCy="createDataset" (click)="goToCreate()" prefixIcon="plus">
      <span class="hidden lg:inline">{{ 'DATASETS._add_dataset' | translate }}</span>
      <span class="inline lg:hidden">{{ 'DATASETS._add_dataset_short' | translate }}</span>
    </app-button>
  </div>
  <app-filtered-paginated-table data-cy="datasetTable" [columns]="columns" [fetchPage]="fetchDatasets"
    [filters]="filters" [filterColumns]="1" [clickable]="true" (rowClick)="goToUpdate($event.id)"
    [defaultSort]="defaultSort">
  </app-filtered-paginated-table>
</app-card>
