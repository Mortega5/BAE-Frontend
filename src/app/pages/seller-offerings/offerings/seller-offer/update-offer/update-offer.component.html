<div class="w-full flex-1 flex flex-col">
  <!-- Breadcrumb -->
  <div class="p-4">
    <button data-cy="editOfferBack" (click)="goBack()" class="inline-flex items-center text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-primary-100 dark:hover:text-primary-50">
      <svg class="w-3 h-3 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 12 10">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 1 1 5l4 4m6-8L7 5l4 4"/>
      </svg>
      {{ 'UPDATE_OFFER._back' | translate }}
    </button>
  </div>
  <!-- End Breadcrumb -->

  @if (notFound) {
  <app-not-found-state message="This offer could not be found." (back)="goBack()" />
  } @else if (loading) {
  <app-loading-spinner />
  } @else {
  <app-offer-form [offer]="offer" [partyId]="partyId" [formType]="'update'" (previewRequested)="onPreviewRequested($event)"></app-offer-form>
  }

  <app-offer-preview-modal [previewProductOff]="previewProductOff" (closed)="previewProductOff = null" />

@if(showError){
    <error-message class="flex justify-center items-center fixed w-fit top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50" [message]="errorMessage"></error-message>
}
