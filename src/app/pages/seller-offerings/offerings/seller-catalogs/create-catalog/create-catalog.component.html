<div class="w-full flex-1 flex flex-col">
  <!-- Breadcrumb -->
  <div class="p-4">
    <button (click)="goBack()"
      class="inline-flex items-center text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-primary-100 dark:hover:text-primary-50">
      <svg class="w-3 h-3 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 12 10">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
          d="M5 1 1 5l4 4m6-8L7 5l4 4" />
      </svg>
      {{ 'CREATE_CATALOG._back' | translate }}
    </button>
  </div>
  <!-- End Breadcrumb -->

  <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-6">{{ 'CREATE_CATALOG._new' | translate }}</h1>

  <app-stepper [canAdvance]="canAdvance" submitLabel="CREATE_CATALOG._create"
    [submitDisabled]="!generalForm.valid || loading" (stepChanged)="onStepChanged($event)"
    (submitted)="createCatalog()">

    <ng-template stepperStep="General Info">
      <div class="flex flex-col gap-5">
        <div>
          <h2 class="text-2xl font-bold text-gray-900 dark:text-white">{{ 'CREATE_CATALOG._general' | translate }}</h2>
          <p class="text-sm text-gray-600 dark:text-gray-400 mt-2">{{ 'CREATE_CATALOG._general_desc' | translate }}</p>
        </div>
        <app-dynamic-form class="block" [fields]="generalFormFields" [formGroup]="generalForm" />
      </div>
    </ng-template>

  </app-stepper>
</div>

@if (showError) {
<error-message
  class="flex justify-center items-center fixed w-fit top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50"
  [message]="errorMessage"></error-message>
}
