<app-card>
  <div appCardHeader class="flex w-full flex-cols items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-content">{{ 'OFFERINGS._catalogs' | translate }}</h2>
      <p class="text-sm text-content-muted mt-1">{{ 'OFFERINGS._manage_catalogs_subtitle' | translate }}
      </p>
    </div>
    <app-button dataCy="newCatalog" (click)="goToCreate()" prefixIcon="plus">
      {{ 'OFFERINGS._add_new_catalog' | translate }}
    </app-button>
  </div>

  <app-filtered-paginated-table data-cy="catalogTable" [columns]="catalogColumns" [fetchPage]="fetchCatalogs"
    [filters]="catalogFilters" [filterColumns]="1" [clickable]="true" (rowClick)="goToUpdate($event.id!)"
    [defaultSort]="defaultSort">
  </app-filtered-paginated-table>
</app-card>
