<div class="mx-auto w-full max-w-screen-xl flex-1 flex flex-col px-4 pb-16 sm:px-8">
  <div class="flex items-start justify-between gap-4 py-6">
    <h1 class="text-3xl font-extrabold text-content">{{ 'FAQ._title' | translate }}</h1>

    @if (checkAdmin) {
    <app-button type="button" data-cy="newFaqEntry" (click)="goToCreate()" prefixIcon="plus">
      {{ 'FAQ._add_faq' | translate }}
    </app-button>
    }
  </div>

  <div class="flex flex-col gap-4">
    @for (faq of faqs; track getEntryId(faq)) {
    <app-card [contentPadding]="isOpen(getEntryId(faq))">
      <div appCardHeader class="flex items-center gap-2">
        <button type="button" class="min-w-0 flex-1 text-left" (click)="toggleFaq(getEntryId(faq))"
          [attr.aria-expanded]="isOpen(getEntryId(faq))">
          <span class="text-xl font-bold text-content break-words">{{ faq.title }}</span>
        </button>

        @if (canManageEntry()) {
        <div class="flex shrink-0 items-center">
          <app-button type="button" (click)="goToUpdate(faq)" variant="ghost" size="sm" prefixIcon="pen-to-square"
            [title]="'FAQ._edit_faq' | translate">
            <span class="sr-only">{{ 'FAQ._edit_faq' | translate }}</span>
          </app-button>
          <app-button type="button" (click)="openDeleteDialog(faq)" [disabled]="isDeletingEntry(faq)" variant="ghost"
            size="sm" prefixIcon="trash" [title]="'FAQ._delete_faq' | translate">
            <span class="sr-only">{{ 'FAQ._delete_faq' | translate }}</span>
          </app-button>
        </div>
        }

        <!-- The question button above is the accessible toggle; the caret is just a second click target. -->
        <button type="button" class="flex shrink-0 items-center p-2 text-content-muted" tabindex="-1" aria-hidden="true"
          (click)="toggleFaq(getEntryId(faq))">
          <fa-icon [icon]="faChevronDown" class="transition-transform" [class.rotate-180]="isOpen(getEntryId(faq))"></fa-icon>
        </button>
      </div>

      @if (isOpen(getEntryId(faq))) {
      <markdown class="block text-content-secondary break-words" [data]="faq.content"></markdown>
      }
    </app-card>
    } @empty {
    <app-empty-state [icon]="faCircleQuestion" heading="FAQ._no_faqs" />
    }
  </div>
</div>

<app-confirm-modal
  [visible]="showDeleteConfirm"
  [title]="deleteConfirmTitle"
  [message]="deleteConfirmMessage"
  [confirmLabel]="deleteConfirmButtonText"
  cancelLabel="CONFIRM_MODAL._cancel"
  confirmVariant="danger"
  (resolved)="$event ? confirmDeleteEntry() : closeDeleteDialog()"
  (closed)="closeDeleteDialog()"
></app-confirm-modal>
